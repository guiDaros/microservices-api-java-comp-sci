spring.application.name=auth-api
server.port=8200

spring.datasource.url=jdbc:postgresql://localhost/db_user
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.cloud.consul.host=localhost
spring.cloud.consul.port=8500

spring.config.import=optional:consul:

# Chave de assinatura dos JWT (a mesma usada pelo gateway-api para validar).
# Pode ser sobrescrita pelo Consul em config/application/app.jwt.secret
app.jwt.secret=chaveSuperSecretaParaJWTdeExemplo!@#123
# Validade do token: 24h
app.jwt.expiration-ms=86400000
