spring.application.name=currency-api
server.port=8100

spring.datasource.url=jdbc:postgresql://localhost/db_currency
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.cloud.consul.host=localhost
spring.cloud.consul.port=8500

spring.config.import=optional:consul:

# API de cotacoes (PTAX) do Banco Central
app.bcb-api.url=https://olinda.bcb.gov.br/olinda/servico/PTAX/versao/v1/odata
# Data da cotacao (yyyy-MM-dd). Vazia = data atual; use um dia util (ex.: 2026-10-09) para nao depender do calendario
app.bcb-api.data-cotacao=

# Retry
resilience4j.retry.instances.bcb-api.max-attempts=3
resilience4j.retry.instances.bcb-api.wait-duration=1s
resilience4j.retry.instances.bcb-api.ignore-exceptions[0]=io.github.resilience4j.circuitbreaker.CallNotPermittedException

# Circuit Breaker
resilience4j.circuitbreaker.instances.bcb-api.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.bcb-api.sliding-window-size=5
resilience4j.circuitbreaker.instances.bcb-api.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.bcb-api.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.bcb-api.wait-duration-in-open-state=100s

# Cache (Caffeine)
spring.cache.type=caffeine
spring.cache.cache-names=bcb-api
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=10m

# Ordem dos aspectos: Cache (99) -> Retry (100) -> Circuit Breaker (101)
resilience4j.retry.retry-aspect-order=100
resilience4j.circuitbreaker.circuit-breaker-aspect-order=101
